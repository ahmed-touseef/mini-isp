!
frr version 10.2.1_git
frr defaults traditional
hostname bologna
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.0.5/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface eth2
 ip address 10.0.0.6/31
 ip router isis CORE
 isis network point-to-point
exit
!
interface lo
 ip address 10.255.0.4/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0102.5500.0004.00
 lsp-gen-interval 1
 spf-interval 1
exit
!
end
