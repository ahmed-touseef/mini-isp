frr defaults traditional
hostname rome
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
 ip ospf passive
!
interface eth1
 ip address 10.0.0.1/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.0.2/31
 ip ospf area 0
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.2
!
line vty
!
