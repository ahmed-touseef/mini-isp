# Mini Iliad: IS-IS core, iBGP route reflectors, internet edge with two upstreams (FRR)
name: miniiliad

mgmt:
  network: miniiliad-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.2.1
    sysctls:
      net.mpls.platform_labels: "1048575"
  nodes:
    milan:
      binds: [generated/milan.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh -c 'for i in eth1 eth2 eth3 eth4 eth5; do sysctl -w net.mpls.conf.$i.input=1; done'
        - ip link add cust0 type dummy
        - ip link set cust0 up
        - ip addr add 192.0.2.1/26 dev cust0
    rome:
      binds: [generated/rome.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh -c 'for i in eth1 eth2 eth3; do sysctl -w net.mpls.conf.$i.input=1; done'
        - ip link add cust0 type dummy
        - ip link set cust0 up
        - ip addr add 192.0.2.65/26 dev cust0
    naples:
      binds: [generated/naples.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh -c 'for i in eth1 eth2 eth3; do sysctl -w net.mpls.conf.$i.input=1; done'
        - ip link add cust0 type dummy
        - ip link set cust0 up
        - ip addr add 192.0.2.129/26 dev cust0
    bologna:
      binds: [generated/bologna.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh -c 'for i in eth1 eth2; do sysctl -w net.mpls.conf.$i.input=1; done'
        - ip link add cust0 type dummy
        - ip link set cust0 up
        - ip addr add 192.0.2.193/26 dev cust0
    rr1:
      binds: [generated/rr1.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh -c 'for i in eth1; do sysctl -w net.mpls.conf.$i.input=1; done'
    rr2:
      binds: [generated/rr2.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh -c 'for i in eth1; do sysctl -w net.mpls.conf.$i.input=1; done'
    br1:
      binds: [generated/br1.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh -c 'for i in eth1; do sysctl -w net.mpls.conf.$i.input=1; done'
    br2:
      binds: [generated/br2.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh -c 'for i in eth1; do sysctl -w net.mpls.conf.$i.input=1; done'
    arelion:
      binds: [configs/arelion.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    cogent:
      binds: [configs/cogent.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    internet:
      binds: [configs/internet.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip link add web0 type dummy
        - ip link set web0 up
        - ip addr add 198.51.100.1/24 dev web0
        - ip addr add 203.0.113.1/24 dev web0

    mix:
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
    rs:
      binds: [configs/rs.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    fastweb:
      binds: [configs/fastweb.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip link add svc0 type dummy
        - ip link set svc0 up
        - ip addr add 198.18.1.1/24 dev svc0
    netflix:
      binds: [configs/netflix.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip link add svc0 type dummy
        - ip link set svc0 up
        - ip addr add 198.18.2.1/24 dev svc0

    bng:
      binds: [generated/bng.conf:/etc/frr/frr.conf, secrets/wg0.conf:/etc/wireguard/wg0.conf, configs/cgnat.nft:/etc/cgnat.nft, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      ports: ["51820:51820/udp"]
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.mpls.conf.eth1.input=1
        - apk add --no-cache -q dnsmasq nftables conntrack-tools wireguard-tools
        - nft -f /etc/cgnat.nft
        - ip link add wg0 type wireguard
        - wg setconf wg0 /etc/wireguard/wg0.conf
        - ip addr add 100.64.1.1/24 dev wg0
        - ip link set wg0 up
        - ip addr add 100.64.0.1/24 dev eth2
        - dnsmasq --interface=eth2 --bind-interfaces --port=0 --dhcp-range=100.64.0.10,100.64.0.200,255.255.255.0,1h --dhcp-option=option:router,100.64.0.1 --dhcp-option=option:dns-server,192.0.2.53 --dhcp-leasefile=/tmp/dnsmasq.leases
    olt:
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
    home1:
      binds: [configs/udhcpc.sh:/etc/udhcpc-lab.sh]
      exec:
        - ip route del default
        - udhcpc -i eth1 -n -t 20 -T 2 -s /etc/udhcpc-lab.sh
    home2:
      binds: [configs/udhcpc.sh:/etc/udhcpc-lab.sh]
      exec:
        - ip route del default
        - udhcpc -i eth1 -n -t 20 -T 2 -s /etc/udhcpc-lab.sh

    dns-mi:
      binds: [generated/dns-mi.conf:/etc/frr/frr.conf, configs/unbound-mi.conf:/etc/unbound/unbound.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - apk add --no-cache -q unbound
        - ip link add any0 type dummy
        - ip link set any0 up
        - ip addr add 192.0.2.53/32 dev any0
        - unbound -c /etc/unbound/unbound.conf
    dns-na:
      binds: [generated/dns-na.conf:/etc/frr/frr.conf, configs/unbound-na.conf:/etc/unbound/unbound.conf, configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - apk add --no-cache -q unbound
        - ip link add any0 type dummy
        - ip link set any0 up
        - ip addr add 192.0.2.53/32 dev any0
        - unbound -c /etc/unbound/unbound.conf

  links:
    - endpoints: ["milan:eth1", "rome:eth1"]           # 10.0.0.0/31
    - endpoints: ["rome:eth2", "naples:eth1"]          # 10.0.0.2/31
    - endpoints: ["naples:eth2", "bologna:eth1"]       # 10.0.0.4/31
    - endpoints: ["bologna:eth2", "milan:eth2"]        # 10.0.0.6/31
    - endpoints: ["milan:eth3", "rr1:eth1"]            # 10.0.0.8/31
    - endpoints: ["naples:eth3", "rr2:eth1"]           # 10.0.0.10/31
    - endpoints: ["milan:eth4", "br1:eth1"]            # 10.0.0.12/31
    - endpoints: ["rome:eth3", "br2:eth1"]             # 10.0.0.14/31
    - endpoints: ["br1:eth2", "arelion:eth1"]          # 10.100.1.0/31
    - endpoints: ["br2:eth2", "cogent:eth1"]           # 10.100.2.0/31
    - endpoints: ["arelion:eth2", "internet:eth1"]     # 10.100.3.0/31
    - endpoints: ["cogent:eth2", "internet:eth2"]      # 10.100.4.0/31
    - endpoints: ["br1:eth3", "mix:eth1"]              # MIX peering LAN 10.200.0.0/24
    - endpoints: ["rs:eth1", "mix:eth2"]
    - endpoints: ["fastweb:eth1", "mix:eth3"]
    - endpoints: ["netflix:eth1", "mix:eth4"]
    - endpoints: ["fastweb:eth2", "internet:eth3"]     # 10.100.5.0/31
    - endpoints: ["netflix:eth2", "internet:eth4"]     # 10.100.6.0/31
    - endpoints: ["milan:eth5", "bng:eth1"]            # 10.0.0.16/31
    - endpoints: ["bng:eth2", "olt:eth1"]              # access network 100.64.0.0/24
    - endpoints: ["home1:eth1", "olt:eth2"]
    - endpoints: ["home2:eth1", "olt:eth3"]
    - endpoints: ["milan:eth6", "dns-mi:eth1"]         # 10.0.0.18/31
    - endpoints: ["naples:eth4", "dns-na:eth1"]        # 10.0.0.20/31
