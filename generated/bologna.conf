! Generated from NetBox by netbox/render.py. Do not edit by hand:
! change NetBox (underlay) or configs/policy/bologna.conf (BGP and policy), then re-render.
frr defaults traditional
hostname bologna
service integrated-vtysh-config
no zebra nexthop kernel enable
no ip nht resolve-via-default
!
bfd
 profile FAST
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 exit
exit
!
interface eth1
 description to naples:eth2
 ip address 10.0.0.5/31
 ip router isis CORE
 isis network point-to-point
 isis bfd
 isis bfd profile FAST
exit
!
interface eth2
 description to milan:eth2
 ip address 10.0.0.6/31
 ip router isis CORE
 isis network point-to-point
 isis metric 15
 isis bfd
 isis bfd profile FAST
exit
!
interface lo
 ip address 10.255.0.4/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0102.5500.0004.00
 lsp-gen-interval 1
 spf-interval 1
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 10.255.0.4/32 index 4
exit
!
router bgp 65000
 bgp router-id 10.255.0.4
 neighbor RR peer-group
 neighbor RR remote-as 65000
 neighbor RR update-source 10.255.0.4
 neighbor RR timers connect 5
 neighbor 10.255.0.11 peer-group RR
 neighbor 10.255.0.12 peer-group RR
 address-family ipv4 unicast
  network 192.0.2.192/26
  neighbor RR activate
 exit-address-family
exit
!

