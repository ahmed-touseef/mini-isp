! Generated from NetBox by netbox/render.py. Do not edit by hand:
! change NetBox (underlay) or configs/policy/dns-mi.conf (BGP and policy), then re-render.
frr defaults traditional
hostname dns-mi
service integrated-vtysh-config
no zebra nexthop kernel enable
no ip nht resolve-via-default
ipv6 forwarding
!
bfd
 profile FAST
  receive-interval 100
  transmit-interval 100
 exit
exit
!
interface eth1
 description to milan:eth6
 ip address 10.0.0.19/31
 ip router isis CORE
 isis network point-to-point
 isis bfd
 isis bfd profile FAST
exit
!
interface lo
 ip address 10.255.0.8/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0102.5500.0008.00
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1200
 set-overload-bit
exit
!
router bgp 65000
 bgp router-id 10.255.0.8
 neighbor RR peer-group
 neighbor RR remote-as 65000
 neighbor RR update-source 10.255.0.8
 neighbor RR timers connect 5
 neighbor 10.255.0.11 peer-group RR
 neighbor 10.255.0.12 peer-group RR
 address-family ipv4 unicast
  network 192.0.2.53/32
 exit-address-family
exit
!

