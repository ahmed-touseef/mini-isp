exit
!
interface eth3
 description to mix:eth1
 ip address 10.200.0.2/24
exit
!
interface lo
 ip address 10.255.0.5/32
 ip router isis CORE
 isis passive
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0102.5500.0005.00
 lsp-gen-interval 1
 spf-interval 1
 segment-routing on
 segment-routing global-block 16000 23999
 segment-routing prefix 10.255.0.5/32 index 5
exit
