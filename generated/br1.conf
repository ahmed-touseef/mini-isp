ip prefix-list BOGONS seq 50 permit 0.0.0.0/0 ge 25
!
ip prefix-list OUR-SPACE seq 5 permit 192.0.2.0/24 le 32
!
ip route 192.0.2.0/24 blackhole
!
router bgp 65000
 bgp router-id 10.255.0.5
 neighbor RR peer-group
 neighbor RR remote-as 65000
 neighbor RR update-source 10.255.0.5
 neighbor RR timers connect 5
 neighbor 10.255.0.11 peer-group RR
 neighbor 10.255.0.12 peer-group RR
 neighbor 10.100.1.1 remote-as 65101
