! change NetBox (underlay) or configs/policy/br1.conf (BGP and policy), then re-render.
frr defaults traditional
hostname br1
service integrated-vtysh-config
no zebra nexthop kernel enable
no ip nht resolve-via-default
!
bfd
 profile FAST
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 exit
exit
!
interface eth1
 description to milan:eth4
 ip address 10.0.0.13/31
 ip router isis CORE
 isis network point-to-point
 isis bfd
 isis bfd profile FAST
exit
!
interface eth2
 description to arelion:eth1
