# Public, read-only Grafana dashboard for the Mini ISP lab.
# Only the shared dashboard, its static files and its data API are reachable; everything else is 404.
limit_req_zone $binary_remote_addr zone=noc:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name noc.touseefahmed.com;

    location = / { return 302 /public-dashboards/1aad5f563ed74c0c8d99f6dfb8a4bc28; }

    location /public-dashboards/ { proxy_pass http://127.0.0.1:3300; include /etc/nginx/proxy_params; }
    location /public/            { proxy_pass http://127.0.0.1:3300; include /etc/nginx/proxy_params; }
    location /api/public/ {
        limit_req zone=noc burst=40 nodelay;
        proxy_pass http://127.0.0.1:3300;
        include /etc/nginx/proxy_params;
    }

    location / { return 404; }
}
