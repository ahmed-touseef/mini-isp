name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-yaml python3-jinja2 shellcheck
      - name: Run CI checks
        run: ./ci/check.sh
